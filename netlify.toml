[build]
  publish = "."
  command = "echo 'Static site � no build step'"

[[headers]]
  for = "/published/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/view.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
