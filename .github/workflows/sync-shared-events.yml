name: Sync shared events

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sync-shared-events]

concurrency:
  group: sync-shared-events
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOY_PAT || github.token }}

      - name: Merge shared event bus into events.json
        run: python3 scripts/sync-shared-events.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if git diff --staged --quiet; then
            echo "No events.json changes"
            exit 0
          fi
          git commit -m "save: sync published events from admin devices"
          git push
          echo "CHANGED=1" >> "$GITHUB_ENV"

      - name: Deploy to Surge
        if: env.CHANGED == '1'
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          DISPATCH_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          DOMAIN="tournament-timetable.surge.sh"
          cp -f index.html 200.html
          if [ -n "$SURGE_TOKEN" ]; then
            npm install -g surge
            surge ./ "$DOMAIN" --token "$SURGE_TOKEN"
            exit 0
          fi
          if [ -n "$DISPATCH_PAT" ]; then
            curl -fsS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $DISPATCH_PAT" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/taka13music/3on3-table-calc/dispatches" \
              -d "{\"event_type\":\"deploy-tournament-timetable\",\"client_payload\":{\"ref\":\"${GITHUB_SHA}\"}}"
            exit 0
          fi
          echo "Deploy secrets are not configured; events.json was still committed."
